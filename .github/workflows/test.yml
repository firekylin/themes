name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Verify generated theme registry
        run: |
          python3 scripts/build-registry.py
          git diff --exit-code -- registry.json archives
          test -z "$(git ls-files --others --exclude-standard -- registry.json archives)"
