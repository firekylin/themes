name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: python3 -m unittest discover -s test -p "test_*.py"
      - uses: actions/checkout@v4
        with:
          repository: firekylin/firekylin
          ref: a200d5887c702acb7c264776d9827f54e8389f09
          path: artifacts/firekylin-core
      - run: FIREKYLIN_CORE_PATH="$GITHUB_WORKSPACE/artifacts/firekylin-core" node --test test/book.test.js
      - run: pnpm exec playwright-core install --with-deps chromium
      - run: pnpm test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: book-visual-checks
          path: artifacts/ports/
