name: Hoffman integration
on:
  pull_request:
    paths: ['packages/hoffman/**', 'verification/hoffman/**', 'test/hoffman.test.js', 'scripts/check-protected-covers.cjs', '.github/workflows/hoffman.yml']
permissions:
  contents: read
jobs:
  live-site:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: firekylin/firekylin
          ref: 6b7c95cf43e0c6af70c71ac1e537d75a982e407e
          path: .verification-core
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
        working-directory: .verification-core
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Test native redacted rows and theme templates
        env:
          FIREKYLIN_CORE_PATH: ${{ github.workspace }}/.verification-core
        run: node --test test/hoffman.test.js
      - name: Verify protected covers over HTTP and in the browser
        env:
          FIREKYLIN_CHECKOUT: ${{ github.workspace }}/.verification-core
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/node_modules/playwright-core
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: node scripts/check-protected-covers.cjs hoffman
      - name: Verify real SQLite site and installed ZIP
        env:
          FIREKYLIN_CHECKOUT: ${{ github.workspace }}/.verification-core
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/node_modules/playwright-core
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: node verification/hoffman/live.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hoffman-live-evidence
          path: verification/hoffman/
