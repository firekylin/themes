name: Button-2 integration
on:
  pull_request:
    paths: ['packages/button-2/**', 'verification/button-2/**', 'test/button-2.test.js', '.github/workflows/button-2.yml']
permissions:
  contents: read
jobs:
  live-site:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: firekylin/firekylin
          ref: 6b7c95cf43e0c6af70c71ac1e537d75a982e407e
          path: .verification-core
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
        working-directory: .verification-core
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install CJK fonts for faithful screenshot text
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Verify real core protected-thumbnail regression
        env:
          FIREKYLIN_CORE_PATH: ${{ github.workspace }}/.verification-core
        run: node --test test/button-2.test.js
      - name: Verify real SQLite site and installed ZIP
        env:
          FIREKYLIN_CHECKOUT: ${{ github.workspace }}/.verification-core
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/node_modules/playwright-core
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: node verification/button-2/live.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: button-2-live-evidence
          path: verification/button-2/
