name: Polymer integration
on:
  pull_request:
    paths: ['packages/polymer/**', 'verification/polymer/**', 'test/polymer.test.js', '.github/workflows/polymer.yml']
permissions:
  contents: read
jobs:
  live-site:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: firekylin/firekylin
          ref: ae71b610ed2dcb6e992366bc06080ec51805042c
          path: .verification-core
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
        working-directory: .verification-core
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Verify real SQLite site and installed ZIP
        env:
          FIREKYLIN_CHECKOUT: ${{ github.workspace }}/.verification-core
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/node_modules/playwright-core
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: node verification/polymer/live.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: polymer-live-evidence
          path: verification/polymer/
