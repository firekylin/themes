name: Vanilla Bootstrap integration
on:
  pull_request:
    paths: ['packages/vanilla-bootstrap/**', 'verification/vanilla-bootstrap/**', 'test/vanilla-bootstrap.test.js', '.github/workflows/vanilla-bootstrap.yml']
permissions:
  contents: read
jobs:
  live-site:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: firekylin/firekylin
          ref: 6b7c95cf43e0c6af70c71ac1e537d75a982e407e
          path: .verification-core
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
        working-directory: .verification-core
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node --test test/vanilla-bootstrap.test.js
      - name: Verify real SQLite site and installed ZIP
        env:
          FIREKYLIN_CHECKOUT: ${{ github.workspace }}/.verification-core
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/node_modules/playwright-core
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: node verification/vanilla-bootstrap/live.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vanilla-bootstrap-live-evidence
          path: verification/vanilla-bootstrap/
