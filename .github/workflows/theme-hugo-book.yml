name: Theme hugo-book
on:
  push:
    paths: ['packages/hugo-book/**', 'validation/suites/hugo-book/**', '.github/workflows/theme-hugo-book.yml']
  pull_request:
    paths: ['packages/hugo-book/**', 'validation/suites/hugo-book/**', '.github/workflows/theme-hugo-book.yml']
permissions:
  contents: read
jobs:
  test:
    if: github.ref == 'refs/heads/main' || github.head_ref == 'feat/hugo-book' || github.ref == 'refs/heads/feat/hugo-book'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: validation/suites/hugo-book
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: node --test test/*.test.js
      - uses: actions/checkout@v4
        with:
          repository: firekylin/firekylin
          ref: a200d5887c702acb7c264776d9827f54e8389f09
          path: artifacts/firekylin-core
      - run: FIREKYLIN_CORE_PATH="$GITHUB_WORKSPACE/artifacts/firekylin-core" node --test test/book.test.js
      - run: pnpm exec playwright-core install --with-deps chromium
        working-directory: .
      - run: node scripts/check-ports-browser.js && node scripts/check-book-browser.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: book-visual-checks
          path: validation/suites/hugo-book/artifacts/ports/
