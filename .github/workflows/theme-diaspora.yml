name: Theme diaspora
on:
  push:
    paths: ['packages/diaspora/**', 'validation/suites/diaspora/**', '.github/workflows/theme-diaspora.yml']
  pull_request:
    paths: ['packages/diaspora/**', 'validation/suites/diaspora/**', '.github/workflows/theme-diaspora.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: validation/suites/diaspora
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: node --test test/*.test.js
      - run: pnpm exec playwright-core install --with-deps chromium
        working-directory: .
      - run: node scripts/check-ports-browser.js && node scripts/check-diaspora-browser.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: theme-port-screenshots
          path: validation/suites/diaspora/artifacts/ports/
