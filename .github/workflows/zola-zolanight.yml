name: ZolaNight integration
on:
  pull_request:
    paths: ['packages/zola-zolanight/**', 'verification/zola-zolanight/**', 'test/zola-zolanight.test.js', '.github/workflows/zola-zolanight.yml']
permissions:
  contents: read
jobs:
  live-site:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: firekylin/firekylin
          ref: ae71b610ed2dcb6e992366bc06080ec51805042c
          path: .verification-core
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
        working-directory: .verification-core
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify real SQLite site and installed ZIP
        env:
          FIREKYLIN_CHECKOUT: ${{ github.workspace }}/.verification-core
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/node_modules/playwright-core
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: node verification/zola-zolanight/live.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zola-zolanight-live-evidence
          path: verification/zola-zolanight/
